name: Agent roadmap task
description: Create one structured agent roadmap task.
title: "AR-x.y: "
labels: [roadmap, agent-task, needs-integration, agent:blocked]
body:
  - type: markdown
    attributes:
      value: |
        The active engineering policy is mandatory for every dispatch:
        **90-minute checkpoint / 120-minute hard stop / two consecutive
        no-gain experiments stop**. Two matching deterministic runs suffice;
        require a third only when they disagree or a concrete risk justifies it.
        For gameplay-performance work, perceived fluidity is the product
        authority. Reaching the acceptance capsule's perceptual terminal ends
        refinement; a fresh metric or reviewer does not reopen it.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [implementation, certification-gate, investigation, epic/integrator]
    validations: {required: true}
  - type: input
    id: parent
    attributes:
      label: Parent
      description: Native parent issue number, for example #400. Implementation requires one.
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Native prerequisite issue numbers, one `- #123` per line, or `None`.
      value: "None"
    validations: {required: true}
  - type: dropdown
    id: layer
    attributes: {label: Layer, options: [language, sdk-2d, target-intrinsic, documentation, validation]}
    validations: {required: true}
  - type: dropdown
    id: target
    attributes: {label: Target, options: [none, gb, nes, gb+nes]}
    validations: {required: true}
  - type: input
    id: owner_seam
    attributes: {label: Owner seam, description: One module boundary only.}
    validations: {required: true}
  - type: textarea
    id: observable
    attributes:
      label: Single observable
      description: |
        One externally observable completion condition. For gameplay, complete
        the immutable acceptance capsule below; tests must guard this experience,
        not replace it with a precision target.
      placeholder: |
        Player action and scene:
        Target and physical observer/emulator:
        Unwanted visible or audible symptom:
        Safety constraints:
        Perceptual terminal:
        Review budget: one review round and one correction round
    validations: {required: true}
  - type: textarea
    id: no_goals
    attributes:
      label: No-goals
      description: Explicitly list work that must not expand this dispatch, including byte/raster/cycle/pose-age precision when irrelevant.
    validations: {required: true}
  - type: textarea
    id: red
    attributes:
      label: Exact RED
      description: |
        Exact command, expected exit code, and first failure signature for the
        correlated guard. When only physical playback preserves a gameplay
        defect, give the exact player actions, observer, and visible/audible
        failure instead of inventing an uncorrelated proxy.
    validations: {required: true}
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: |
        Smallest commands that can decide the observable. Run broad validation
        once on the final candidate when production or shared .NET behavior
        changed; never after every diagnostic/refinement step. Require two
        matching focused GREEN runs. Classify a broad failure before editing and
        do not expand the slice for unrelated or exactness-only failures.
      placeholder: |
        dotnet test <focused-owner-project> -m:1 --filter <observable>
        dotnet test RetroSharp.sln -m:1  # final candidate, when applicable
        dotnet run --project src/RetroSharp.Cli/RetroSharp.Cli.csproj -- --target gb --out samples/runner/bin/runner.gb samples/runner/runner.retrosharp.json
        git diff --check
    validations: {required: true}
  - type: textarea
    id: publication
    attributes:
      label: Publication authority
      description: Checkpoint push also requires opt-in during both claim and checkpoint. PR and merge must remain forbidden.
      value: |
        Local commit: allowed
        Checkpoint push: forbidden
        Pull request: forbidden
        Merge: forbidden
    validations: {required: true}
  - type: textarea
    id: dispatch_metadata
    attributes:
      label: Dispatch metadata
      description: Detector work may use terra-xhigh. sol-max requires a non-empty `Escalation justification:` line.
      value: "Model: terra-high\nEffort: high"
    validations: {required: true}
  - type: textarea
    id: handoff
    attributes: {label: Handoff destination, description: Integrator issue/owner and preserved worktree destination.}
    validations: {required: true}
